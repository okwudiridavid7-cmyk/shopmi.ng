services:
  mysql:
    image: mysql:8.0
    container_name: vendors-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vendors
      MYSQL_USER: vendors
      MYSQL_PASSWORD: vendors
    volumes:
      - vendors_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vendors-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vendors_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vendors_mysql_data:
  vendors_redis_data:
