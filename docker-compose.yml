services:
  postgres:
    image: postgres:16-alpine
    container_name: vendors-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vendors
      POSTGRES_PASSWORD: vendors
      POSTGRES_DB: vendors
    volumes:
      - vendors_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendors -d vendors"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vendors-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vendors_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vendors_postgres_data:
  vendors_redis_data:
